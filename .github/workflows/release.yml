name: Release

# Merging a PR into main pushes to main. If package.json then has a version
# with no tag yet, build the extension and publish a GitHub release for it:
# tag vX.Y.Z, notes from that version's section of RELEASE_NOTES.md, and the
# zip attached. Merges that don't bump the version publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released. Bump version in package.json to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        if: steps.version.outputs.exists == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: pnpm build

      - name: Extract release notes
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The "## X.Y.Z (date)" section, up to the next "## " heading
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) found = 1 }
            found
          ' RELEASE_NOTES.md > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          asset="color-hub-$TAG-chrome.zip"
          cp build/chrome-mv3-prod.zip "$asset"
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            echo "::warning::RELEASE_NOTES.md has no section for $TAG, so GitHub generated the notes."
            notes=(--generate-notes)
          fi
          gh release create "$TAG" "$asset" --title "$TAG" --target "$GITHUB_SHA" "${notes[@]}"
